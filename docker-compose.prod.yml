name: orba-app

services:
  postgres:
    image: postgres:17-alpine
    container_name: orba-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbaagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbaagent_prod_pw}
      POSTGRES_DB: ${POSTGRES_DB:-orbaagent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-orbaagent} -d $${POSTGRES_DB:-orbaagent}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: orba-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  minio:
    image: elestio/minio:latest
    container_name: orba-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_prod_pw}
    volumes:
      - minio_data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: orba-api
    restart: unless-stopped
    environment:
      PORT: 3001
      HOST: "0.0.0.0"
      NODE_ENV: production
      COMMIT_SHA: ${COMMIT_SHA:-0bcb47e714cde255dc2f1987e24c141753fd3aa0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-orbaagent}:${POSTGRES_PASSWORD:-orbaagent_prod_pw}@postgres:5432/${POSTGRES_DB:-orbaagent}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_prod_pw}
      ORBA_ADMIN_TOKEN: ${ORBA_ADMIN_TOKEN}
      LANGDOCK_API_KEY: ${LANGDOCK_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ALLOWED_ORIGINS: "https://orbaagent.dev,https://www.orbaagent.dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orba-api.rule=(Host(`orbaagent.dev`) || Host(`www.orbaagent.dev`)) && (PathPrefix(`/health`) || PathPrefix(`/v1`))"
      - "traefik.http.routers.orba-api.entrypoints=websecure"
      - "traefik.http.routers.orba-api.tls.certresolver=${CERT_RESOLVER:-le-http}"
      - "traefik.http.routers.orba-api.priority=10"
      - "traefik.http.services.orba-api.loadbalancer.server.port=3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: orba-web
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: "0.0.0.0"
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://orbaagent.dev
      LANGDOCK_API_KEY: ${LANGDOCK_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ORBA_ADMIN_TOKEN: ${ORBA_ADMIN_TOKEN}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_SECRET_ID: ${GITHUB_SECRET_ID}
      ALLOWED_ORIGINS: "https://orbaagent.dev,https://www.orbaagent.dev"
      # Persistent artifact/upload storage. Explicitly set so the code never
      # falls back to <cwd>/.uploads inside the read-only image layer.
      ORBA_UPLOAD_DIR: /data/uploads
      # Workspace identity for upload/artifact paths. Optional; the application
      # defaults to "default-tenant" when unset.
      ORBA_TENANT_ID: ${ORBA_TENANT_ID:-}
    volumes:
      # Named volume (not a bind mount): survives container recreation, restart,
      # and image rebuild. Seeded with node:node ownership from the image layer
      # at apps/web/Dockerfile.
      - orba_uploads_data:/data/uploads
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-net
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orba-web.rule=Host(`orbaagent.dev`) || Host(`www.orbaagent.dev`)"
      - "traefik.http.routers.orba-web.entrypoints=websecure"
      - "traefik.http.routers.orba-web.tls.certresolver=${CERT_RESOLVER:-le-http}"
      - "traefik.http.routers.orba-web.priority=5"
      - "traefik.http.services.orba-web.loadbalancer.server.port=3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  # Persistent artifact/upload storage mounted into orba-web at /data/uploads.
  orba_uploads_data:

networks:
  app-net:
    driver: bridge
  traefik-net:
    external: true
