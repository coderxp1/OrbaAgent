version: '3.8'

# OrbaAgent GPU media worker.
#
# GPU ISOLATION IS ENFORCED BY CONFIGURATION
# ------------------------------------------
# This worker may only ever use GPU 1 (GPU-82e03c6c-8c27-c076-eb42-7e37e9a5a878).
# GPU 0 is reserved (paul's allocation, 2026-10-21) and must never be
# selected by the worker, the MOVA service, or Ollama. Isolation rests on
# three independent layers:
#
#   1. deploy.resources.reservations.devices.device_ids  -> the NVIDIA container
#      runtime mounts ONLY that device's nodes into the container, so GPU 0 is
#      not even visible from inside.
#   2. NVIDIA_VISIBLE_DEVICES                            -> restricts the runtime
#      device set to the same UUID.
#   3. CUDA_VISIBLE_DEVICES=0                            -> renumbers the single
#      remaining device to index 0 inside the container.
#
# The worker additionally queries nvidia-smi by explicit UUID (never by index),
# so a misconfiguration surfaces as an error instead of silently reading GPU 0.
#
# DO NOT add `--gpus all`, `privileged: true`, or /dev/nvidia* host mounts.
# infra/orbaagent-gpu/tests/test_gpu_isolation.py asserts all of this.

services:
  orbaagent-gpu-worker:
    container_name: orbaagent-gpu-worker
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # WireGuard tunnel only. Production reaches the worker over the WireGuard tunnel by
      # dialling 10.77.0.2:8190, which terminates on wg-orba; 8190 is never published
      # on eth0 and never reachable from the public internet.
      - "10.77.0.2:8190:8190"
    environment:
      - NVIDIA_VISIBLE_DEVICES=GPU-82e03c6c-8c27-c076-eb42-7e37e9a5a878
      - CUDA_VISIBLE_DEVICES=0
      - MEDIA_WORKER_PORT=8190
      # The worker queries this exact UUID; it never selects a GPU by ordering.
      - MEDIA_WORKER_GPU_UUID=GPU-82e03c6c-8c27-c076-eb42-7e37e9a5a878
      # --- Generation backend -------------------------------------------------
      # `diffusers` is the only implemented backend. Any other value (or unset)
      # leaves generation UNAVAILABLE: the endpoints return 503
      # MEDIA_GENERATION_UNAVAILABLE and /health reports generation as false.
      # Setting this does NOT by itself make the capability available — the model
      # must actually load first.
      - MEDIA_GENERATION_BACKEND=${MEDIA_GENERATION_BACKEND:-}
      - MEDIA_GENERATION_IMAGE_MODEL=${MEDIA_GENERATION_IMAGE_MODEL:-black-forest-labs/FLUX.1-schnell}
      - MEDIA_GENERATION_VIDEO_MODEL=${MEDIA_GENERATION_VIDEO_MODEL:-Lightricks/LTX-Video}
      # --- Video backend (independent of the image backend above) -----------
      # Set MEDIA_GENERATION_VIDEO_BACKEND=mova together with
      # MEDIA_GENERATION_VIDEO_MODEL=OpenMOSS-Team/MOVA-720p to route video
      # generation to the MOVA service below. The worker verifies the
      # service's pinned model revision at load and fails closed (no WAN/LTX
      # fallback) when it is unreachable or reports a different revision.
      - MEDIA_GENERATION_VIDEO_BACKEND=${MEDIA_GENERATION_VIDEO_BACKEND:-}
      - MOVA_SERVICE_URL=http://orbaagent-mova:8200
      - MEDIA_MOVA_TOKEN_FILE=/run/secrets/media_mova_token
      - MOVA_OFFLOAD=${MOVA_OFFLOAD:-cpu}
      - MOVA_INFERENCE_STEPS=${MOVA_INFERENCE_STEPS:-50}
      - MOVA_TIMEOUT_SECONDS=${MOVA_TIMEOUT_SECONDS:-14400}
      - MEDIA_MODELS_DIR=/models
      - MEDIA_OUTPUT_DIR=/output
      # One generation at a time until VRAM behaviour is measured on real hardware.
      - MEDIA_MAX_CONCURRENT_GENERATIONS=1
      # --- Secrets (no defaults, no committed values) -------------------------
      # MEDIA_WORKER_TOKEN_FILE points at a Docker secret. The value never appears
      # in the environment, in `docker inspect` output, or in this file.
      - MEDIA_WORKER_TOKEN_FILE=/run/secrets/media_worker_token
      # Token used to deliver generated artifacts to production. The GPU host and
      # the production host share no filesystem.
      - MEDIA_INGEST_URL=${MEDIA_INGEST_URL:-https://orbaagent.dev/api/internal/media/ingest}
      - MEDIA_INGEST_TOKEN_FILE=/run/secrets/media_ingest_token
      - ORBA_TENANT_ID=${ORBA_TENANT_ID:-}
    secrets:
      - media_worker_token
      - media_ingest_token
      - media_mova_token
    volumes:
      # Model weights are downloaded here. Never committed to git.
      - ./models:/models
      # Generated artifacts, pending delivery to production.
      - ./output:/output
      - ./data:/data
    networks:
      - orbaagent_media_net
    extra_hosts:
      - "orbaagent.dev:10.77.0.1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['GPU-82e03c6c-8c27-c076-eb42-7e37e9a5a878']
              capabilities: [gpu]

  # MOVA-720p video inference service. Internal only: no host port is
  # published; the worker reaches it over orbaagent_media_net. The model
  # checkpoint is the pinned host download, mounted read-only — it is
  # never downloaded by the service or baked into the image.
  orbaagent-mova:
    container_name: orbaagent-mova
    build:
      context: ./mova_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=GPU-82e03c6c-8c27-c076-eb42-7e37e9a5a878
      - CUDA_VISIBLE_DEVICES=0
      - MOVA_CKPT_PATH=/models/mova-720p
      - MOVA_REPO_DIR=/opt/mova/repo
      - MOVA_SERVICE_TOKEN_FILE=/run/secrets/media_mova_token
      - MOVA_JOB_TIMEOUT_SECONDS=${MOVA_TIMEOUT_SECONDS:-14400}
    secrets:
      - media_mova_token
    volumes:
      - /srv/orba-mova/model:/models/mova-720p:ro
    networks:
      - orbaagent_media_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['GPU-82e03c6c-8c27-c076-eb42-7e37e9a5a878']
              capabilities: [gpu]

  orbaagent-comfyui:
    container_name: orbaagent-comfyui
    build:
      context: .
      dockerfile: Dockerfile.comfyui
    restart: unless-stopped
    ports:
      # Private only, accessible via wireguard tunnel 10.77.0.2 if needed, but primarily internally
      - "10.77.0.2:8189:8188"
    environment:
      - NVIDIA_VISIBLE_DEVICES=GPU-82e03c6c-8c27-c076-eb42-7e37e9a5a878
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./models:/app/ComfyUI/models:ro
      - ./output:/app/ComfyUI/output
    user: "1500"
    networks:
      - orbaagent_media_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['GPU-82e03c6c-8c27-c076-eb42-7e37e9a5a878']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 3


  orbaagent-ollama:
    container_name: orbaagent-ollama
    image: ollama/ollama:0.5.12
    restart: unless-stopped
    ports:
      # WireGuard tunnel only. Production reaches Ollama over the WireGuard tunnel by
      # dialling 10.77.0.2:11435, which terminates on wg-orba; 11435 is never published
      # on eth0 and never reachable from the public internet.
      # Port 11435 ensures complete isolation from CoderXP Ollama on 127.0.0.1:11434.
      - "10.77.0.2:11435:11434"
    environment:
      - NVIDIA_VISIBLE_DEVICES=GPU-82e03c6c-8c27-c076-eb42-7e37e9a5a878
      - CUDA_VISIBLE_DEVICES=0
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/root/.ollama/models
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - orbaagent_ollama_models:/root/.ollama
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - orbaagent_media_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['GPU-82e03c6c-8c27-c076-eb42-7e37e9a5a878']
              capabilities: [gpu]

secrets:
  media_worker_token:
    file: ./secrets/media_worker_token
  media_ingest_token:
    file: ./secrets/media_ingest_token
  media_mova_token:
    file: ./secrets/media_mova_token

volumes:
  orbaagent_ollama_models:
    name: orbaagent_ollama_models

networks:
  orbaagent_media_net:
    driver: bridge
