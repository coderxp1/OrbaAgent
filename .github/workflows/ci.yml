name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crlf-check:
    name: CRLF Line Endings Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Shell and Dockerfile LF Line Endings
        run: node infra/scripts/check-crlf.mjs

  shellcheck:
    name: Shell Scripts Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run bash syntax check
        run: |
          for file in infra/scripts/*.sh; do
            if [ -f "$file" ]; then
              echo "Checking syntax: $file"
              bash -n "$file"
            fi
          done

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "infra/scripts"

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  lint:
    name: Lint & Code Style (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run Biome Check
        run: pnpm run lint

  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build shared package
        run: pnpm --filter=@orbaagent/shared run build

      - name: Run typecheck
        run: pnpm run typecheck

  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run tests
        run: pnpm run test

  docker-build:
    name: Docker Builds & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Proxy Docker Compose Config
        run: |
          touch infra/proxy/acme/acme.json
          docker compose -f infra/proxy/docker-compose.proxy.yml config

      - name: Build apps/api Docker Image
        run: docker build -t orba-api:ci -f apps/api/Dockerfile .

      - name: Build services/agent-runtime Docker Image
        run: docker build -t orba-agent-runtime:ci -f services/agent-runtime/Dockerfile .

      - name: Build services/orchestrator Docker Image
        run: docker build -t orba-orchestrator:ci -f services/orchestrator/Dockerfile .

      - name: Build services/computer-runtime Docker Image
        run: docker build -t orba-computer-runtime:ci -f services/computer-runtime/Dockerfile .

      - name: Build services/model-gateway Docker Image
        run: docker build -t orba-model-gateway:ci -f services/model-gateway/Dockerfile .

      - name: Build services/scheduler Docker Image
        run: docker build -t orba-scheduler:ci -f services/scheduler/Dockerfile .
